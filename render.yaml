# Конфиг для бесплатного хостинга Render (render.com).
# Разворачивается кнопкой "Deploy to Render" из README. Токен сюда НЕ пишем:
# Render сам спросит его при создании и сохранит в секретах.
services:
  - type: web
    name: ai-casher-bot
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Владелец бота: только ему бот отвечает, ему же идут отчёты и бэкапы.
      # Telegram ID не секрет (его видит любой бот, которому ты пишешь), поэтому он прямо тут.
      - key: ALLOWED_USER_IDS
        value: "6069246522"
      # Ключ бесплатного ИИ (Groq: https://console.groq.com/keys). Необязательно:
      # можно оставить пустым и добавить позже в Environment. В репозиторий ключ НЕ пишем.
      - key: AI_API_KEY
        sync: false
      # Gemini «смотрит» ролики трейдеров на YouTube (/mentors). Бесплатно: https://aistudio.google.com/apikey
      # Необязательно: если AI_API_KEY уже от Gemini (начинается с AQ. или AIza), этот ключ не нужен.
      - key: GEMINI_API_KEY
        sync: false
      # Торговля (необязательно): ключ биржи ТОЛЬКО со спотовой торговлей, БЕЗ права вывода.
      # Можно оставить пустым и добавить позже в Environment. Бот работает только с Bybit и BingX
      # (см. /keys в боте). В репозиторий ключи НЕ пишем.
      - key: BYBIT_API_KEY
        sync: false
      - key: BYBIT_API_SECRET
        sync: false
      - key: BINGX_API_KEY
        sync: false
      - key: BINGX_API_SECRET
        sync: false
      # Кошелёк Phantom: только ПУБЛИЧНЫЙ адрес Solana (просмотр баланса). Сид-фразу НИКОГДА.
      # Можно не заполнять, а прислать боту командой /phantom АДРЕС.
      - key: PHANTOM_ADDRESS
        sync: false
      # 💸 Мемкоины (/meme): приватный ключ ОТДЕЛЬНОГО аккаунта «Бот» в Phantom с небольшой суммой.
      # Только здесь, в Render. Никогда в чат, ИИ или репозиторий. Основной кошелёк и сид-фраза не нужны.
      - key: SOLANA_TRADER_KEY
        sync: false
      # Необязательно: бесплатный ключ Jupiter (developers.jup.ag/portal) — быстрее сделки
      - key: JUPITER_API_KEY
        sync: false
      # Т-Инвестиции: токен T-Invest API с доступом «Только чтение» (бот только показывает портфель)
      - key: TINVEST_TOKEN
        sync: false
      # Самообновление: Render → Settings → Deploy Hook → скопировать сюда (секрет, не публикуй)
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
      # Сводка автоторговли в чат раз в N часов (0 = не присылать)
      - key: AUTO_REPORT_HOURS
        value: "6"
      # Лимиты торговли (можно менять в боте: /set max_trade 20)
      - key: MAX_TRADE_USD
        value: "10"
      - key: DAILY_LOSS_USD
        value: "2"
